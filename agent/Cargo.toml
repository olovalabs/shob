# shob — embedded upstream runtime + CLI source vendored for Shob.
# Upstream docs, website, scripts, packaging and examples were removed; the
# library crates remain complete.
[workspace]
members = [
    "crates/telemetry",
    "crates/ai",
    "crates/agent",
    "crates/tools",
    "crates/durable",
    "crates/harness",
    "crates/cli",
    "crates/runtime",
    "crates/tui",
    "crates/plugin-sdk",
    "crates/extensions",
    "crates/embedded",
    # Required by the upstream resource-selection integration tests.
    "examples/plugin-stub",
]
default-members = [
    "crates/agent",
    "crates/tools",
    "crates/harness",
    "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/bigfish1913/pi-rust"
homepage = "https://rpi.laofu.online/"
version = "0.21.0"
authors = ["BigFish <fuwei201473@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2", "gzip"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
ciborium = "0.2"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# Internal crates.
telemetry = { path = "crates/telemetry", version = "0.21.0" }
ai = { path = "crates/ai", version = "0.21.0" }
agent = { path = "crates/agent", version = "0.21.0" }
tools = { path = "crates/tools", version = "0.21.0" }
durable = { path = "crates/durable", version = "0.21.0" }
harness = { path = "crates/harness", version = "0.21.0" }

runtime = { path = "crates/runtime", version = "0.21.0" }

tui = { path = "crates/tui", version = "0.21.0" }

plugin-sdk = { path = "crates/plugin-sdk", version = "0.21.0" }
extensions = { path = "crates/extensions", version = "0.21.0" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
