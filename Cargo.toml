[package]
name = "shob"
version = "0.0.3"
edition = "2024"
rust-version = "1.94.1"
description = "GPU-accelerated terminal emulator built for developers orchestrating AI coding agents"
readme = "README.md"
license = "(MIT OR Apache-2.0) AND GPL-3.0-or-later"

[dependencies]
# Exact engine pins: the local gpui-component 0.5.1 fork and gpui-kit 0.10.0
# (the gpui-kit release on the gpui-fast 0.1.16 generation) share them.
gpui = { package = "gpui-fast", version = "=0.1.16" }
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.16", features = ["wayland", "x11"] }
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-kit = { version = "=0.10.0", features = ["gpui-fast"] }
terminal = { path = "terminal" }
agent-cli = { package = "cli", path = "agent/crates/cli", features = ["shob"] }
embedded = { path = "agent/crates/embedded" }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json", "serde"] }
directories = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
portable-pty = "0.9"
alacritty_terminal = "0.25.1"
anyhow = "1"
base64 = "0.22"
parking_lot = "0.12"
rfd = "0.15"
libc = "0.2"
regex = "1"
pulldown-cmark = "0.12"
toml = "1"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
gpui-updater-core = { version = "=0.4.4", features = ["delta"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
tree-sitter = "0.25"
gpui = { package = "gpui-fast", version = "0.1.16", features = ["test-support"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.16", features = ["test-support", "wayland", "x11"] }

[patch.crates-io]
gpui-component = { path = "components" }
gpui-component-macros = { path = "components/macros" }

[profile.dev]
opt-level = 1
debug = 1
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.shob]
opt-level = 2

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3

[profile.dev.package.terminal]
opt-level = 3

[profile.dev.package.alacritty_terminal]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
# Strip symbols from the release binary: smaller artifact, faster loads.
strip = true
